<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      background: radial-gradient(120% 90% at 50% 0%, #141824 0%, #0b0d12 60%);
      color: #e7eaf0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── header ── */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px; height: 52px; flex: none;
    }
    header .title { font-weight: 600; font-size: 14px; color: #aab2c0; }
    #dot { width: 8px; height: 8px; border-radius: 50%;
           background: #e6b23a; flex: none; transition: background .3s; }
    #dot.ready { background: #3ecf6f; }
    #dot.error { background: #e05252; }
    #status { color: #6f7889; font-size: 12px; flex: 1;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* sound output: speaker icon + segmented toggle */
    .out { display: flex; align-items: center; gap: 8px; color: #6f7889; }
    .seg {
      display: flex; padding: 3px; border-radius: 10px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    }
    .seg button {
      border: none; background: transparent; color: #8b94a7;
      font-size: 12.5px; font-weight: 500; padding: 5px 14px;
      border-radius: 7px; cursor: pointer; transition: all .2s;
    }
    .seg button.active { background: #2f3a4e; color: #eef1f6; }

    /* ── stage: only the latest utterance, dissolving like mist ── */
    #stage {
      flex: 1; position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center; overflow: hidden;
    }
    .line {
      max-width: 720px;
      opacity: 0; filter: blur(14px); transform: translateY(10px);
      transition: opacity 1.1s ease, filter 1.1s ease, transform 1.1s ease;
      will-change: opacity, filter, transform;
    }
    .line.show { opacity: 1; filter: blur(0); transform: none;
                 transition-duration: .45s; }
    #you { color: #8b94a7; font-size: 15px; font-weight: 400; }
    #bot {
      color: #f3f5fa; font-size: clamp(22px, 3.4vw, 34px); font-weight: 300;
      line-height: 1.45; letter-spacing: .005em;
      text-shadow: 0 0 24px rgba(140, 170, 255, .18);
    }
    /* tool calls: collapsible cards — spinner → ✓/✕, expand for args/output */
    #tools {
      position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
      width: min(560px, 88vw); display: flex; flex-direction: column; gap: 6px;
      text-align: left;
    }
    .tcall {
      background: rgba(20, 25, 34, .92); color: #c6cdd9; font-size: 12.5px;
      border: 1px solid rgba(255,255,255,.09); border-left: 2px solid #7aa2ff;
      border-radius: 10px; box-shadow: 0 6px 22px rgba(0,0,0,.35);
      overflow: hidden; transition: opacity .9s ease, filter .9s ease;
    }
    .tcall.err { border-left-color: #e05252; }
    .tcall.fade { opacity: 0; filter: blur(6px); }
    .tcall summary { display: flex; align-items: center; gap: 7px;
      padding: 7px 11px; cursor: pointer; list-style: none; }
    .tcall summary::-webkit-details-marker { display: none; }
    .tcall .chev { display: flex; flex: none; opacity: .6; transition: transform .15s; }
    .tcall[open] .chev { transform: rotate(90deg); }
    .tcall .st { flex: none; width: 12px; height: 12px; font-size: 11px;
      line-height: 12px; text-align: center; }
    .tcall .st.run { border: 2px solid rgba(255,255,255,.15);
      border-top-color: #7aa2ff; border-radius: 50%;
      animation: spin .7s linear infinite; }
    .tcall .st.ok { color: #5fd48a; }
    .tcall .st.bad { color: #e05252; }
    .tcall .tn { color: #eef1f6; flex: none;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    .tcall .ta { opacity: .55; flex: 1; min-width: 0; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
    .tcall .tbody { padding: 0 11px 9px 32px; }
    .tcall .tlab { font-size: 9.5px; letter-spacing: .6px;
      text-transform: uppercase; opacity: .5; margin: 6px 0 3px; }
    .tcall pre { margin: 0; padding: 6px 8px; border-radius: 6px;
      background: rgba(255,255,255,.05); white-space: pre-wrap;
      word-break: break-word; max-height: 200px; overflow: auto;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 11.5px; }
    .tcall img { display: block; max-width: 100%; max-height: 150px;
      border-radius: 6px; margin-top: 2px; cursor: zoom-in; }
    .tcall img.big { max-height: none; cursor: zoom-out; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── mic ── */
    footer {
      flex: none; display: flex; justify-content: center;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    }
    #mic {
      width: 64px; height: 64px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.05); color: #cdd3dd;
      cursor: pointer; border: 1px solid rgba(255,255,255,.12);
      transition: background .25s, border-color .25s, color .25s;
    }
    #mic:hover { background: rgba(255,255,255,.09); }
    #mic.on { background: #c62828; border-color: #c62828; color: #fff;
              animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 13px rgba(198, 40, 40, .16); } }
  </style>
</head>
<body>

  <header>
    <span class="title">Agent</span>
    <span id="dot"></span>
    <span id="status">connecting...</span>
    <div class="out" title="Voice output">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6.5 9H3v6h3.5L11 19z"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
      </svg>
      <div class="seg" id="outSeg">
        <button data-v="local" class="active">Local</button>
        <button data-v="robot">Robot</button>
      </div>
    </div>
  </header>

  <div id="stage">
    <div class="line" id="you"></div>
    <div class="line" id="bot"></div>
    <div id="tools"></div>
  </div>

  <footer>
    <button id="mic" title="talk">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
        <line x1="12" y1="18" x2="12" y2="21"/>
      </svg>
    </button>
  </footer>

  <!-- Instructions + tools — edit that file -->
  <script src="prompt.js"></script>

  <!-- Plumbing below (realtime WS / mic / speaker / stage) — no need to read it -->
  <script>
    const REALTIME_URL = 'wss://api.physicar.ai/realtime';
    // Injected by the notebook's Run cell (JSON-quoted); without the notebook
    // the placeholder stays and the prompt.js default applies.
    var CONFIG_INSTRUCTIONS = "__INSTRUCTIONS__";
    var instructions = CONFIG_INSTRUCTIONS.indexOf("__") === 0 ? INSTRUCTIONS : CONFIG_INSTRUCTIONS;
    // Robot speaker: same-origin WS endpoint (works in SIM and on the real kit)
    const SPEAKER_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
                        + location.host + '/audio/stream';

    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const micBtn = document.getElementById('mic');
    const youEl = document.getElementById('you');
    const botEl = document.getElementById('bot');
    const toolsEl = document.getElementById('tools');

    let ws = null;               // realtime session (cloud)
    let inputRate = 16000;       // from session.ready
    let outputRate = 24000;
    let retryMs = 1500;
    let ignoreInterrupt = false; // image injection echoes one fake "interrupted"
    let turn = { user: '', assistant: '' };  // current turn transcripts

    function setStatus(state, text) {
      dotEl.className = state;   // '' (yellow) | 'ready' | 'error'
      statusEl.textContent = text;
    }

    // ── mist lines: show now, dissolve later ──
    function show(el, text) {
      clearTimeout(el._fade);
      if (text !== undefined) el.textContent = text;
      el.classList.add('show');
    }
    function dissolve(el, delay) {
      clearTimeout(el._fade);
      el._fade = setTimeout(() => el.classList.remove('show'), delay);
    }

    // ── sound output: Local (this browser) or Robot — segmented toggle ──
    let outVal = 'local';
    const seg = document.getElementById('outSeg');
    seg.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b || b.dataset.v === outVal) return;
      outVal = b.dataset.v;
      for (const x of seg.children) x.classList.toggle('active', x === b);
      cutSpeaker();  // silence whatever is still queued on the old output
    };

    // robot: binary PCM16 frames to the /audio/stream WS.
    // Closing the WS drops the audio the robot hasn't spoken yet (barge-in).
    let spk = null, spkQueue = [];

    function speakRobot(bytes) {
      if (spk && spk.readyState === 1) { spk.send(bytes); return; }
      spkQueue.push(bytes);
      if (spk && spk.readyState === 0) return;  // already connecting
      spk = new WebSocket(SPEAKER_URL + '?sample_rate=' + outputRate + '&channels=1');
      spk.binaryType = 'arraybuffer';
      spk.onopen = () => { for (const b of spkQueue) spk.send(b); spkQueue = []; };
      spk.onerror = () => { spk = null; spkQueue = []; };
    }

    // local: schedule PCM16 chunks back-to-back with Web Audio.
    let playCtx = null, playHead = 0, playingSrcs = [];

    function speakLocal(bytes) {
      if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (playCtx.state === 'suspended') playCtx.resume();
      const pcm = new Int16Array(bytes.buffer, 0, bytes.byteLength >> 1);
      const buf = playCtx.createBuffer(1, pcm.length, outputRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
      const src = playCtx.createBufferSource();
      src.buffer = buf;
      src.connect(playCtx.destination);
      playHead = Math.max(playHead, playCtx.currentTime);
      src.start(playHead);
      playHead += buf.duration;
      playingSrcs.push(src);
      src.onended = () => {
        const i = playingSrcs.indexOf(src);
        if (i >= 0) playingSrcs.splice(i, 1);
      };
    }

    function speak(b64) {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      if (outVal === 'robot') speakRobot(bytes);
      else speakLocal(bytes);
    }

    function cutSpeaker() {
      if (spk) { try { spk.close(); } catch (e) {} }
      spk = null; spkQueue = [];
      for (const s of playingSrcs) { try { s.stop(); } catch (e) {} }
      playingSrcs = []; playHead = 0;
    }

    // ── realtime session: browser ↔ PhysiCar cloud, token as WS subprotocol ──
    function connect() {
      const token = window.physicarSession && physicarSession.token();
      if (!token) {
        // Not signed in (yet). Signing in on the App page (Chat) plants the
        // session cookie even after this page loaded — keep watching for it.
        setStatus('error', 'Sign in on the App page (Chat) — waiting...');
        setTimeout(connect, 3000);
        return;
      }
      setStatus('', 'connecting...');
      ws = new WebSocket(REALTIME_URL, ['token.' + token]);
      ws.onopen = () => ws.send(JSON.stringify({
        type: 'session.start',
        prompt: {
          instructions: instructions,
          tools: Object.entries(TOOLS).map(([name, t]) => (
            { name, description: t.description, properties: t.properties || [] })),
        },
      }));
      ws.onmessage = onMessage;
      // The session can die outside our control (idle timeout, network blip).
      // Auto-reconnect with a fresh session instead of going dead.
      ws.onclose = () => {
        cutSpeaker();
        turn = { user: '', assistant: '' };
        setStatus('', 'reconnecting... (new session)');
        setTimeout(connect, retryMs);
        retryMs = Math.min(retryMs * 2, 10000);
      };
    }

    // ── tool cards: spinner → ✓/✕, expandable args/output, then mist away ──
    function toolCard(name, args) {
      const el = document.createElement('details');
      el.className = 'tcall';
      el.innerHTML =
        '<summary>'
        + '<span class="chev"><svg width="13" height="13" viewBox="0 0 16 16">'
        + '<path fill="currentColor" d="M6 3.5 L12 8 L6 12.5 Z"/></svg></span>'
        + '<span class="st run"></span>'
        + '<span class="tn"></span><span class="ta"></span>'
        + '</summary><div class="tbody"></div>';
      el.querySelector('.tn').textContent = name;
      el.querySelector('.ta').textContent = Object.entries(args)
        .map(([k, v]) => k + ': ' + JSON.stringify(v)).join('  ');
      if (Object.keys(args).length) {
        el.querySelector('.tbody').innerHTML = '<div class="tlab">arguments</div>';
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(args, null, 2);
        el.querySelector('.tbody').appendChild(pre);
      }
      // keep the stage tidy: at most 3 cards on screen
      while (toolsEl.children.length >= 3) toolsEl.firstChild.remove();
      toolsEl.appendChild(el);
      el.addEventListener('toggle', () => {
        if (el.open) clearTimeout(el._t);        // reading — don't fade
        else mistAway(el, 2500);
      });
      return el;
    }

    function toolDone(el, ok, output, image) {
      const st = el.querySelector('.st');
      st.className = 'st ' + (ok ? 'ok' : 'bad');
      st.textContent = ok ? '✓' : '✕';
      if (!ok) el.classList.add('err');
      const body = el.querySelector('.tbody');
      const lab = document.createElement('div');
      lab.className = 'tlab';
      lab.textContent = 'output';
      body.appendChild(lab);
      if (image) {
        const img = document.createElement('img');
        img.src = 'data:image/jpeg;base64,' + image;
        img.onclick = (e) => { e.preventDefault(); img.classList.toggle('big'); };
        body.appendChild(img);
      }
      if (output) {
        const pre = document.createElement('pre');
        try { pre.textContent = JSON.stringify(JSON.parse(output), null, 2); }
        catch (e) { pre.textContent = output; }
        body.appendChild(pre);
      }
      mistAway(el, 5000);
    }

    function mistAway(el, delay) {
      clearTimeout(el._t);
      el._t = setTimeout(() => {
        if (el.open) return;                     // expanded — keep it
        el.classList.add('fade');
        setTimeout(() => el.remove(), 900);
      }, delay);
    }

    async function runTool(msg) {
      const card = toolCard(msg.name, msg.arguments || {});
      let output = '', image = null, ok = true;
      try {
        const tool = TOOLS[msg.name];
        if (!tool) { output = 'unknown tool: ' + msg.name; ok = false; }
        else {
          const r = await tool.run(msg.arguments || {});
          if (r && typeof r === 'object') { output = r.output; image = r.image || null; }
          else output = String(r);
        }
      } catch (e) {
        output = 'tool failed: ' + e.message;
        ok = false;
      }
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type: 'tool_result', call_id: msg.call_id,
                                name: msg.name, output}));
        if (image) {
          // tool_result first, then the image completing the turn — this
          // makes the model describe the photo right away.
          ignoreInterrupt = true;
          ws.send(JSON.stringify({type: 'image', data: image,
                                  mime: 'image/jpeg', turn_complete: true}));
        }
      }
      toolDone(card, ok, output, image);
    }

    function onMessage(e) {
      const msg = JSON.parse(e.data);
      if (msg.type === 'session.ready') {
        retryMs = 1500;
        if (msg.audio_config) {
          inputRate = msg.audio_config.input_rate;
          outputRate = msg.audio_config.output_rate;
        }
        setStatus('ready', 'ready');
      }
      else if (msg.type === 'audio.delta') speak(msg.data);
      else if (msg.type === 'transcript.delta') {
        turn[msg.role] = (turn[msg.role] || '') + msg.text;
        if (msg.role === 'user') {
          turn.assistant = '';          // new question — let the old answer go
          dissolve(botEl, 400);
          show(youEl, turn.user);
        } else {
          show(botEl, turn.assistant);
        }
      }
      else if (msg.type === 'turn.complete') {
        // let the words linger, then dissolve into the mist
        dissolve(youEl, 2000);
        dissolve(botEl, 6000);
        turn = { user: '', assistant: '' };
      }
      else if (msg.type === 'tool_call') runTool(msg);
      else if (msg.type === 'interrupted') {
        if (ignoreInterrupt) { ignoreInterrupt = false; return; }
        cutSpeaker();  // user barged in — drop unplayed audio
        dissolve(botEl, 200);
        turn.assistant = '';
      }
      else if (msg.type === 'error') {
        if (/token|auth|401/i.test((msg.code || '') + ' ' + (msg.message || ''))) {
          // stale token — drop it; the reconnect loop then waits for a fresh
          // sign-in (the App page plants the cookie the moment it happens)
          try { physicarSession.clear(); } catch (e2) {}
          setStatus('error', 'Session expired — sign in on the App page (Chat)');
        } else {
          setStatus('error', msg.message);
        }
      }
      else if (msg.type === 'session.end') {
        setStatus('', 'session ended'
          + (msg.session_cost != null ? ' ($' + msg.session_cost.toFixed(4) + ')' : ''));
      }
    }
    connect();

    // The app runs entirely in this browser — with run.py stopped, a loaded
    // page would keep working forever. Poll the origin; when nginx reports
    // the backend offline, hand over to its offline page (which auto-returns
    // once run.py is back).
    setInterval(async () => {
      try {
        const r = await fetch('.', {cache: 'no-store'});
        if (r.headers.get('X-MyApp-Status') === 'offline') location.reload();
      } catch (e) {}
    }, 5000);

    // never leave the robot driving if the page goes away
    addEventListener('pagehide', () => {
      const zero = new Blob([JSON.stringify({value: 0})], {type: 'application/json'});
      navigator.sendBeacon('/speed', zero);
      navigator.sendBeacon('/steering', zero);
    });

    // ── microphone: capture → downsample to inputRate → PCM16 → base64 ──
    let audioCtx = null, micStream = null, micOn = false;

    async function startMic() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true } });
      audioCtx = new AudioContext();
      const src = audioCtx.createMediaStreamSource(micStream);
      const proc = audioCtx.createScriptProcessor(4096, 1, 1);
      src.connect(proc);
      proc.connect(audioCtx.destination);  // required by some browsers
      proc.onaudioprocess = (e) => {
        if (!micOn || !ws || ws.readyState !== 1) return;
        const inp = e.inputBuffer.getChannelData(0);
        const ratio = audioCtx.sampleRate / inputRate;
        const n = Math.floor(inp.length / ratio);
        const pcm = new Int16Array(n);
        for (let i = 0; i < n; i++) {
          const s = Math.max(-1, Math.min(1, inp[Math.floor(i * ratio)]));
          pcm[i] = s * 32767;
        }
        let bin = '';
        const bytes = new Uint8Array(pcm.buffer);
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        ws.send(JSON.stringify({type: 'audio', data: btoa(bin)}));
      };
    }

    micBtn.onclick = async () => {
      if (!micOn) {
        if (!audioCtx) { try { await startMic(); } catch (err) { setStatus('error', 'mic: ' + err.message); return; } }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        micOn = true; micBtn.classList.add('on');
      } else {
        micOn = false; micBtn.classList.remove('on');
      }
    };

    // Start listening right away — the button is a mute toggle, not a starter.
    (async () => {
      try {
        await startMic();
        micOn = true; micBtn.classList.add('on');
      } catch (e) {
        setStatus('error', 'mic: ' + e.message);   // click the mic to retry
      }
    })();

    // Autoplay policy can leave audio contexts suspended when created without
    // a gesture — the first interaction anywhere unlocks them.
    function unlockAudio() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (playCtx && playCtx.state === 'suspended') playCtx.resume();
    }
    addEventListener('pointerdown', unlockAudio);
    addEventListener('keydown', unlockAudio);
  </script>
</body>
</html>
